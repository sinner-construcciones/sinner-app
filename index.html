<style>
:root{
  --bg:#ebedee; --surface:#ffffff; --soft:#f4f5f6; --ink:#1b2124; --muted:#5c676c; --line:#d3d8da;
  --accent:#8a6a00; --gold:#d9a91a; --accent-ink:#1b2124; --accent-soft:#f6edcf;
  --good:#1d7349; --good-soft:#dcefe4; --bad:#b0261d; --bad-soft:#f6dedb; --warn:#9a6200; --warn-soft:#f5ead3;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* layout: app de una pantalla — barra superior, contenido con scroll, navegación fija abajo (pulgar) */
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181a; --surface:#1d2326; --soft:#242b2e; --ink:#e8ecee; --muted:#9aa6ab; --line:#333c40;
    --accent:#e6bb45; --gold:#e0b030; --accent-ink:#1b1606; --accent-soft:#3a3016;
    --good:#5cc690; --good-soft:#173326; --bad:#f08a80; --bad-soft:#3b1d1a; --warn:#e2b056; --warn-soft:#3a2d14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181a; --surface:#1d2326; --soft:#242b2e; --ink:#e8ecee; --muted:#9aa6ab; --line:#333c40;
  --accent:#e6bb45; --gold:#e0b030; --accent-ink:#1b1606; --accent-soft:#3a3016;
  --good:#5cc690; --good-soft:#173326; --bad:#f08a80; --bad-soft:#3b1d1a; --warn:#e2b056; --warn-soft:#3a2d14;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{background:#ffffff;color:#2b2b2d;border-bottom:3px solid var(--gold);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.04em;margin:0;text-transform:uppercase}
header.top h1{line-height:0}.logo{height:40px;width:auto;display:block}
.blue{font-size:12px;background:#f4f1e6;border:1px solid #d9cfa8;color:#2b2b2d;font-weight:600;border-radius:999px;padding:4px 10px;cursor:pointer;font-variant-numeric:tabular-nums}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
nav.tabs{background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:10px 2px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
h2{font-family:var(--display);font-size:22px;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600}
.stat .num{font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.num.neg{color:var(--bad)} .num.pos{color:var(--good)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 14px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--soft)}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted);grid-column:1}
.item .m{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;grid-row:1/3;grid-column:2;align-self:center}
.day{font-size:12px;font-weight:700;color:var(--muted);padding:8px 14px;background:var(--soft);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-acc{background:var(--accent-soft);color:var(--accent)} .p-mut{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted)}
.banner{border-radius:8px;padding:10px 12px;font-size:14px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.fab{position:sticky;bottom:0;display:flex;justify-content:flex-end;pointer-events:none}
.fab .btn{pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.18)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}
td:first-child,th:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:700}
tfoot td{font-weight:800;border-bottom:0}
.tbl{overflow-x:auto}
/* hoja / formulario */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,16,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:10px;font-size:16px;color:var(--ink);font-weight:400;width:100%}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--soft);padding:10px 4px;font-weight:600;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mic{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;font-size:13px}
.mic.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.obra-card{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini div{font-size:12px;color:var(--muted)}
.mini b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.hero{background:#ffffff;border:1px solid var(--line);border-bottom:4px solid var(--gold);border-radius:14px;padding:28px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:18px}
.hero-logo{width:min(260px,72%);height:auto;display:block}
.hero-name{font-family:var(--display);font-weight:800;font-size:40px;color:#2b2b2d}
.mision{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#2b2b2d}
.mision i{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:78px}
.tile:hover{background:var(--soft)}
.tile b{font-family:var(--display);font-size:17px}
.tile span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:20;display:none}
@media (max-width:420px){.mini{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
#printArea{display:none}
@media print{body.imprimiendo>*{display:none!important}body.imprimiendo>#printArea{display:block!important;color:#111;background:#fff;padding:24px;font:14px/1.5 system-ui,sans-serif}}
.hoybar{display:none;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:7px 12px;background:#2b2b2d;color:#f5f1e6;font-size:13px;font-weight:600}
.hoybar.on{display:flex}
.hoybar .pz{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.08)}
.hoybar .k{color:#c9a227;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.05em}
.hoybar .v{font-variant-numeric:tabular-nums}
.hamb{background:none;border:0;padding:8px;margin-right:4px;cursor:pointer;display:flex;flex-direction:column;gap:4px;border-radius:8px}
.hamb span{display:block;width:22px;height:2.5px;background:#2b2b2d;border-radius:2px}
.hamb:hover{background:#f3efe4}
.drawerBg{position:fixed;inset:0;background:rgba(20,20,22,.45);z-index:60}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(290px,84vw);background:var(--surface,#fff);z-index:61;box-shadow:4px 0 24px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow-y:auto;transform:translateX(-102%);transition:transform .2s ease}
.drawer.open{transform:none}
.drawer .dh{padding:16px 18px;border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between;gap:8px}
.drawer .dh b{font-size:15px}
.drawer .grp{padding:10px 18px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.drawer a,.drawer button.it{display:flex;align-items:center;gap:12px;padding:11px 18px;color:inherit;text-decoration:none;font-weight:600;font-size:15px;background:none;border:0;width:100%;text-align:left;cursor:pointer}
.drawer a:hover,.drawer button.it:hover{background:#f6f2e7}
.drawer a[aria-current="page"]{background:#f6f2e7;box-shadow:inset 4px 0 0 var(--gold)}
.drawer .ic{width:22px;text-align:center}
.grpd{border-top:1px solid var(--line)}.grpd summary{display:flex;justify-content:space-between;gap:8px;padding:10px 2px;cursor:pointer;font-weight:600}.grpd .list{margin:0 0 10px}
@media (min-width:900px){
  body.conMenu nav.tabs,body.conMenu #menuBtn,body.conMenu .drawerBg,body.conMenu #menuClose{display:none!important}
  body.conMenu .drawer,body.conMenu .drawer[hidden]{display:flex!important;transform:none;width:250px;box-shadow:none;border-right:1px solid var(--line);z-index:5}
  body.conMenu header.top,body.conMenu main{margin-left:250px}
}
.cierreT td,.cierreT th{padding:6px 4px;font-size:13px;white-space:nowrap}
.cierreT input{width:110px;padding:6px;text-align:right}
</style>
</head>
